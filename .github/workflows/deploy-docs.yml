name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout paulnamalomba.github.io
        uses: actions/checkout@v4
        with:
          path: main-repo
      
      - name: Checkout system-management_scripts
        uses: actions/checkout@v4
        with:
          repository: paulnamalomba/system-management_scripts
          path: system-management_scripts
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install Python dependencies
        run: pip install markdown pygments
      
      - name: Prepare docs directory
        run: |
          # Remove symlink and create real directory
          rm -rf main-repo/docs/guides
          mkdir -p main-repo/docs/guides
          cp -r system-management_scripts/guides/* main-repo/docs/guides/ || true
          # Disable Jekyll processing
          touch main-repo/.nojekyll
          
      - name: Generate HTML from Markdown
        run: |
          cd main-repo/docs/guides
          python3 << 'PYTHON_SCRIPT'
          import markdown
          import os
          
          guides = []
          for md_file in sorted(os.listdir('.')):
              if md_file.endswith('.md'):
                  guides.append(md_file)
                  html_file = md_file[:-3] + '.html'
                  
                  with open(md_file, 'r', encoding='utf-8') as f:
                      content = f.read()
                  
                  html_content = markdown.markdown(
                      content, 
                      extensions=['fenced_code', 'codehilite', 'tables', 'toc']
                  )
                  
                  title = md_file[:-3].replace('_', ' ').title()
                  
                  full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{title} - Paul Namalomba</title>
              <style>
                  body {{
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 20px;
                      line-height: 1.6;
                      color: #24292e;
                  }}
                  .nav {{ 
                      margin-bottom: 30px;
                      padding-bottom: 10px;
                      border-bottom: 1px solid #e1e4e8;
                  }}
                  .nav a {{
                      color: #0366d6;
                      text-decoration: none;
                  }}
                  .nav a:hover {{ text-decoration: underline; }}
                  h1, h2, h3, h4 {{ 
                      color: #24292e;
                      margin-top: 24px;
                      margin-bottom: 16px;
                      font-weight: 600;
                  }}
                  h1 {{ 
                      padding-bottom: 0.3em;
                      border-bottom: 1px solid #eaecef;
                  }}
                  code {{
                      background: #f6f8fa;
                      padding: 0.2em 0.4em;
                      border-radius: 3px;
                      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                      font-size: 85%;
                  }}
                  pre {{
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      line-height: 1.45;
                  }}
                  pre code {{
                      background: none;
                      padding: 0;
                      font-size: 100%;
                  }}
                  a {{ color: #0366d6; text-decoration: none; }}
                  a:hover {{ text-decoration: underline; }}
                  table {{
                      border-collapse: collapse;
                      width: 100%;
                      margin: 20px 0;
                  }}
                  th, td {{
                      border: 1px solid #d0d7de;
                      padding: 6px 13px;
                      text-align: left;
                  }}
                  th {{
                      background-color: #f6f8fa;
                      font-weight: 600;
                  }}
                  tr:nth-child(2n) {{
                      background-color: #f6f8fa;
                  }}
                  blockquote {{
                      padding: 0 1em;
                      color: #57606a;
                      border-left: 0.25em solid #d0d7de;
                      margin: 0 0 16px 0;
                  }}
              </style>
          </head>
          <body>
              <div class="nav">
                  <a href="index.html">← Back to Guides</a> | 
                  <a href="../index.html">Home</a>
              </div>
              {html_content}
          </body>
          </html>'''
                  
                  with open(html_file, 'w', encoding='utf-8') as f:
                      f.write(full_html)
          
          # Create index page
          index_html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Technical Guides - Paul Namalomba</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      max-width: 800px;
                      margin: 50px auto;
                      padding: 20px;
                      line-height: 1.6;
                      color: #24292e;
                  }
                  h1 { 
                      color: #24292e;
                      border-bottom: 1px solid #eaecef;
                      padding-bottom: 0.3em;
                  }
                  .nav {
                      margin-bottom: 30px;
                  }
                  .nav a {
                      color: #0366d6;
                      text-decoration: none;
                  }
                  .nav a:hover { text-decoration: underline; }
                  ul { 
                      list-style: none; 
                      padding: 0; 
                  }
                  li { 
                      margin: 15px 0;
                      padding: 10px;
                      background: #f6f8fa;
                      border-radius: 6px;
                  }
                  li:hover {
                      background: #eef2f5;
                  }
                  a.guide-link { 
                      color: #0366d6; 
                      text-decoration: none;
                      font-size: 1.1em;
                      font-weight: 500;
                  }
                  a.guide-link:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <div class="nav">
                  <a href="../index.html">← Home</a>
              </div>
              <h1>📚 Technical Guides</h1>
              <p>Power user guides and technical documentation for system administration and development.</p>
              <ul>
          '''
          
          for guide in guides:
              html_name = guide[:-3] + '.html'
              title = guide[:-3].replace('_', ' ').title()
              index_html += f'        <li><a class="guide-link" href="{html_name}">{title}</a></li>\n'
          
          index_html += '''    </ul>
          </body>
          </html>'''
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_html)
          PYTHON_SCRIPT
      
      - name: Generate root index.html from README
        run: |
          cd main-repo
          python3 << 'PYTHON_SCRIPT'
          import markdown
          
          # Read README.md
          with open('README.md', 'r', encoding='utf-8') as f:
              content = f.read()
          
          # Convert to HTML
          html_content = markdown.markdown(
              content, 
              extensions=['fenced_code', 'tables', 'toc']
          )
          
          # Create full HTML page
          full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <meta name="description" content="Paul Namalomba - Computational Engineer, Software Engineer & Materials Scientist">
              <title>Paul Namalomba - Computational Engineer</title>
              <style>
                  body {{
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 20px;
                      line-height: 1.6;
                      color: #24292e;
                  }}
                  .nav {{
                      margin-bottom: 30px;
                      padding: 10px 0;
                      border-bottom: 2px solid #0366d6;
                  }}
                  .nav a {{
                      color: #0366d6;
                      text-decoration: none;
                      margin-right: 20px;
                      font-weight: 500;
                  }}
                  .nav a:hover {{ text-decoration: underline; }}
                  h1, h2, h3, h4 {{ 
                      color: #24292e;
                      margin-top: 24px;
                      margin-bottom: 16px;
                      font-weight: 600;
                  }}
                  h1 {{ 
                      padding-bottom: 0.3em;
                      border-bottom: 1px solid #eaecef;
                      font-size: 2em;
                  }}
                  h2 {{
                      padding-bottom: 0.3em;
                      border-bottom: 1px solid #eaecef;
                      font-size: 1.5em;
                  }}
                  code {{
                      background: #f6f8fa;
                      padding: 0.2em 0.4em;
                      border-radius: 3px;
                      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                      font-size: 85%;
                  }}
                  pre {{
                      background: #f6f8fa;
                      padding: 16px;
                      border-radius: 6px;
                      overflow-x: auto;
                      line-height: 1.45;
                  }}
                  pre code {{
                      background: none;
                      padding: 0;
                      font-size: 100%;
                  }}
                  a {{ color: #0366d6; text-decoration: none; }}
                  a:hover {{ text-decoration: underline; }}
                  img {{ max-width: 100%; height: auto; }}
                  blockquote {{
                      padding: 0 1em;
                      color: #57606a;
                      border-left: 0.25em solid #d0d7de;
                      margin: 0 0 16px 0;
                  }}
                  ul, ol {{
                      padding-left: 2em;
                  }}
                  li {{
                      margin: 0.5em 0;
                  }}
                  .linkedin-badge {{
                      margin: 20px auto 30px auto;
                      padding: 20px;
                      background: #f6f8fa;
                      border-radius: 6px;
                      text-align: center;
                      max-width: 500px;
                  }}
              </style>
              <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
          </head>
          <body>
              <div class="nav">
                  <a href="/">Home</a>
                  <a href="https://github.com/paulnamalomba" target="_blank">GitHub</a>
                  <a href="https://paulnamalomba.github.io/Paul-Namalomba_Curriculum-Vitae.pdf" target="_blank">Resume (CV)</a>
                  <a href="https://www.linkedin.com/in/paul-namalomba" target="_blank">LinkedIn</a>
                  <a href="/docs/guides/">Technical Guides</a>
              </div>
              <div class="linkedin-badge">
                  <div class="badge-base LI-profile-badge" data-locale="en_US" data-size="medium" data-theme="dark" data-type="HORIZONTAL" data-vanity="paulnamalomba" data-version="v1"><a class="badge-base__link LI-simple-link" href="https://za.linkedin.com/in/paulnamalomba?trk=profile-badge">Paul Namalomba</a></div>
              </div>
              {html_content}
          </body>
          </html>'''
          
          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(full_html)
          PYTHON_SCRIPT
      
      - name: Generate docs/index.html
        run: |
          cd main-repo/docs
          python3 << 'PYTHON_SCRIPT'
          import markdown
          import os
          
          # Check if index.md exists
          if os.path.exists('index.md'):
              with open('index.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Remove front matter if present
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 3:
                      content = parts[2].strip()
              
              # Convert markdown links to .html
              content = content.replace('.md)', '.html)')
              
              # Convert to HTML
              html_content = markdown.markdown(
                  content, 
                  extensions=['fenced_code', 'tables', 'toc']
              )
              
              # Create full HTML page
              full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Technical Documentation - Paul Namalomba</title>
              <style>
                  body {{
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
                      max-width: 900px;
                      margin: 0 auto;
                      padding: 20px;
                      line-height: 1.6;
                      color: #24292e;
                  }}
                  .nav {{
                      margin-bottom: 30px;
                      padding: 10px 0;
                      border-bottom: 2px solid #0366d6;
                  }}
                  .nav a {{
                      color: #0366d6;
                      text-decoration: none;
                      margin-right: 20px;
                      font-weight: 500;
                  }}
                  .nav a:hover {{ text-decoration: underline; }}
                  h1, h2, h3, h4 {{ 
                      color: #24292e;
                      margin-top: 24px;
                      margin-bottom: 16px;
                      font-weight: 600;
                  }}
                  h1 {{ 
                      padding-bottom: 0.3em;
                      border-bottom: 1px solid #eaecef;
                      font-size: 2em;
                  }}
                  h2 {{
                      padding-bottom: 0.3em;
                      border-bottom: 1px solid #eaecef;
                      font-size: 1.5em;
                  }}
                  a {{ color: #0366d6; text-decoration: none; }}
                  a:hover {{ text-decoration: underline; }}
                  ul {{
                      padding-left: 2em;
                  }}
                  li {{
                      margin: 0.5em 0;
                  }}
              </style>
          </head>
          <body>
              <div class="nav">
                  <a href="/">Home</a>
                  <a href="/docs/guides/">Technical Guides</a>
                  <a href="https://github.com/paulnamalomba" target="_blank">GitHub</a>
              </div>
              {html_content}
          </body>
          </html>'''
              
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(full_html)
          PYTHON_SCRIPT
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
