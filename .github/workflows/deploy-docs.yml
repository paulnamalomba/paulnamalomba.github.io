name: Deploy Docs to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout paulnamalomba.github.io
        uses: actions/checkout@v4
        with:
          path: main-repo
      
      - name: Checkout system-management_scripts
        uses: actions/checkout@v4
        with:
          repository: paulnamalomba/system-management_scripts
          path: system-management_scripts
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install Python dependencies
        run: pip install markdown pygments
      
      - name: Prepare docs directory
        run: |
          # Remove symlink and create real directory
          rm -rf main-repo/docs/guides
          mkdir -p main-repo/docs/guides
          cp -r system-management_scripts/guides/* main-repo/docs/guides/ || true
          # Copy system scripts into system-scripts directory (flat, alongside index)
          rm -rf main-repo/docs/system-scripts
          mkdir -p main-repo/docs/system-scripts
          cp -r system-management_scripts/windows/*.ps1 main-repo/docs/system-scripts/ || true
          # Guide home (README overview)
          mkdir -p main-repo/docs/guide-home
          # Disable Jekyll processing
          touch main-repo/.nojekyll
          
      - name: Generate HTML from Markdown
        run: |
          cd main-repo/docs/guides
          python3 << 'PYTHON_SCRIPT'
          import os
          import markdown

          def to_title(filename: str) -> str:
              return filename[:-3].replace('_', ' ').title()

          guides = []
          for md_file in sorted(os.listdir('.')):
              if not md_file.endswith('.md'):
                  continue

              guides.append(md_file)
              html_file = md_file[:-3] + '.html'

              with open(md_file, 'r', encoding='utf-8') as f:
                  content = f.read()

              # Convert intra-doc links that point at .md files to .html
              content = content.replace('.md)', '.html)')

              html_content = markdown.markdown(
                  content,
                  extensions=['fenced_code', 'codehilite', 'tables', 'toc']
              )

              title = to_title(md_file)

              full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{title} - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="https://paulnamalomba.github.io/">Portfolio Home</a></li>
                              <li><a href="/docs/guide-home/">Guides & Scripts</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="index.html">← Back to Guides</a>
                          <span>|</span>
                          <a href="/">Portfolio Home</a>
                      </div>
                      <article class="docs-content">{html_content}</article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

              with open(html_file, 'w', encoding='utf-8') as f:
                  f.write(full_html)

          # Guides index
          index_html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Technical Guides - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guide-home/">Guides & Scripts</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <h2>Technical Guides</h2>
                  <div class="grid">\
          '''

          for guide in guides:
              html_name = guide[:-3] + '.html'
              title = to_title(guide)
              index_html += f'''                      <div class="card">
                          <h3><a href="{html_name}">{title}</a></h3>
                      </div>\n'''

          index_html += '''                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_html)
          PYTHON_SCRIPT
      
      - name: Generate docs/index.html
        run: |
          cd main-repo/docs
          python3 << 'PYTHON_SCRIPT'
          import markdown
          import os
          
          # Check if index.md exists
          if os.path.exists('index.md'):
              with open('index.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Remove front matter if present
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 3:
                      content = parts[2].strip()
              
              # Convert markdown links to .html
              content = content.replace('.md)', '.html)')
              
              # Convert to HTML
              html_content = markdown.markdown(
                  content, 
                  extensions=['fenced_code', 'tables', 'toc']
              )
              
              # Create full HTML page
              full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Technical Documentation - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guide-home/">Guides & Scripts</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="/">Portfolio Home</a>
                          <span>|</span>
                          <a href="/docs/guide-home/">Guides & Scripts</a>
                          <span>|</span>
                          <a href="/docs/guides/">Tech Guides</a>
                          <span>|</span>
                          <a href="/docs/system-scripts/">System Scripts</a>
                      </div>
                      <article class="docs-content">{html_content}</article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''
              
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(full_html)
          PYTHON_SCRIPT

      - name: Generate docs/guide-home/index.html from README
        run: |
          mkdir -p main-repo/docs/guide-home
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          import markdown

          readme_path = os.path.join('system-management_scripts', 'README.md')
          with open(readme_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Fix email markdown link to be a proper mailto
          content = content.replace('](kabwenzenamalomba@gmail.com)', '](mailto:kabwenzenamalomba@gmail.com)')

          # Rewrite repo-relative guide links to the deployed docs HTML pages
          content = re.sub(r'\(guides/([^\)]+?)\.md\)', r'(/docs/guides/\1.html)', content)

          # Rewrite repo-relative script links to the deployed script HTML pages
          content = re.sub(r'\(windows/([^\)]+?)\.ps1\)', r'(/docs/system-scripts/\1.html)', content)

          html_content = markdown.markdown(
              content,
              extensions=['fenced_code', 'codehilite', 'tables', 'toc']
          )

          full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Guide & Scripts - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guide-home/">Guides & Scripts</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="/">Portfolio Home</a>
                          <span>|</span>
                          <a href="/docs/guides/">Tech Guides</a>
                          <span>|</span>
                          <a href="/docs/system-scripts/">System Scripts</a>
                      </div>
                      <article class="docs-content">{html_content}</article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

          out_path = os.path.join('main-repo', 'docs', 'guide-home', 'index.html')
          with open(out_path, 'w', encoding='utf-8') as f:
              f.write(full_html)
          PYTHON_SCRIPT

      - name: Generate system-scripts index and individual script pages
        run: |
          cd main-repo/docs/system-scripts
          python3 << 'PYTHON_SCRIPT'
          import os
          from pygments import highlight
          from pygments.lexers import PowerShellLexer
          from pygments.formatters import HtmlFormatter

          def to_title(filename: str) -> str:
              return filename[:-4].replace('-', ' ').replace('_', ' ').title()

          lexer = PowerShellLexer()
          formatter = HtmlFormatter(
              linenos=True,
              cssclass='codehilite',
              style='default',
          )
          highlight_css = formatter.get_style_defs('.codehilite')

          scripts = []
          for ps1_file in sorted(os.listdir('.')):
              if not ps1_file.endswith('.ps1'):
                  continue

              scripts.append(ps1_file)
              html_file = ps1_file[:-4] + '.html'

              with open(ps1_file, 'r', encoding='utf-8') as f:
                  source = f.read()

              # Extract first comment block as description
              desc_lines = []
              for line in source.splitlines():
                  stripped = line.strip()
                  if stripped.startswith('#'):
                      desc_lines.append(stripped.lstrip('# ').strip())
                  elif stripped == '':
                      if desc_lines:
                          break
                  else:
                      break
              description = ' — '.join(desc_lines[:2]) if desc_lines else ''

              highlighted = highlight(source, lexer, formatter)
              title = to_title(ps1_file)

              full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{title} - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
              <style>{highlight_css}</style>
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guide-home/">Guides & Scripts</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="index.html">← Back to System Scripts</a>
                          <span>|</span>
                          <a href="/docs/guide-home/">Guides & Scripts</a>
                          <span>|</span>
                          <a href="/">Portfolio Home</a>
                      </div>
                      <article class="docs-content">
                          <h1>{title}</h1>
                          <p><code>{ps1_file}</code> · <a href="{ps1_file}" download>Download Script</a></p>
                          {highlighted}
                      </article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

              with open(html_file, 'w', encoding='utf-8') as f:
                  f.write(full_html)

          # ── Build card-based index page (like /docs/guides/) ──

          cards_html = ''
          for script in scripts:
              html_name = script[:-4] + '.html'
              title = to_title(script)

              # Re-extract description for the card
              with open(script, 'r', encoding='utf-8') as f:
                  lines = f.read().splitlines()
              desc_parts = []
              for line in lines:
                  stripped = line.strip()
                  if stripped.startswith('#'):
                      desc_parts.append(stripped.lstrip('# ').strip())
                  elif stripped == '':
                      if desc_parts:
                          break
                  else:
                      break
              desc = desc_parts[0] if desc_parts else script

              cards_html += f'''                      <div class="card">
                          <h3><a href="{html_name}">{title}</a></h3>
                          <p>{desc}</p>
                          <p><code>{script}</code></p>
                      </div>\n'''

          index_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>System Scripts - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guide-home/">Guides & Scripts</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <h2>System Scripts</h2>
                  <div class="grid">
          {cards_html}                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_html)
          PYTHON_SCRIPT
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
