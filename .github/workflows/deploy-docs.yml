name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout paulnamalomba.github.io
        uses: actions/checkout@v4
        with:
          path: main-repo
      
      - name: Checkout system-management_scripts
        uses: actions/checkout@v4
        with:
          repository: paulnamalomba/system-management_scripts
          path: system-management_scripts
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install Python dependencies
        run: pip install markdown pygments
      
      - name: Prepare docs directory
        run: |
          # Remove symlink and create real directory
          rm -rf main-repo/docs/guides
          mkdir -p main-repo/docs/guides
          cp -r system-management_scripts/guides/* main-repo/docs/guides/ || true
          # Disable Jekyll processing
          touch main-repo/.nojekyll
          
      - name: Generate HTML from Markdown
        run: |
          cd main-repo/docs/guides
          python3 << 'PYTHON_SCRIPT'
          import os
          import markdown

          def to_title(filename: str) -> str:
              return filename[:-3].replace('_', ' ').title()

          guides = []
          for md_file in sorted(os.listdir('.')):
              if not md_file.endswith('.md'):
                  continue

              guides.append(md_file)
              html_file = md_file[:-3] + '.html'

              with open(md_file, 'r', encoding='utf-8') as f:
                  content = f.read()

              # Convert intra-doc links that point at .md files to .html
              content = content.replace('.md)', '.html)')

              html_content = markdown.markdown(
                  content,
                  extensions=['fenced_code', 'codehilite', 'tables', 'toc']
              )

              title = to_title(md_file)

              full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>{title} - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="https://paulnamalomba.github.io/">Site Home</a></li>
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="index.html">← Back to Guides</a>
                          <span>|</span>
                          <a href="/">Site Home</a>
                      </div>
                      <article class="docs-content">{html_content}</article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

              with open(html_file, 'w', encoding='utf-8') as f:
                  f.write(full_html)

          # Guides index
          index_html = '''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Technical Guides - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <h2>Technical Guides</h2>
                  <div class="grid">\
          '''

          for guide in guides:
              html_name = guide[:-3] + '.html'
              title = to_title(guide)
              index_html += f'''                      <div class="card">
                          <h3><a href="{html_name}">{title}</a></h3>
                      </div>\n'''

          index_html += '''                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

          with open('index.html', 'w', encoding='utf-8') as f:
              f.write(index_html)
          PYTHON_SCRIPT
      
      - name: Generate docs/index.html
        run: |
          cd main-repo/docs
          python3 << 'PYTHON_SCRIPT'
          import markdown
          import os
          
          # Check if index.md exists
          if os.path.exists('index.md'):
              with open('index.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              
              # Remove front matter if present
              if content.startswith('---'):
                  parts = content.split('---', 2)
                  if len(parts) >= 3:
                      content = parts[2].strip()
              
              # Convert markdown links to .html
              content = content.replace('.md)', '.html)')
              
              # Convert to HTML
              html_content = markdown.markdown(
                  content, 
                  extensions=['fenced_code', 'tables', 'toc']
              )
              
              # Create full HTML page
              full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>Technical Documentation - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="/">Site Home</a>
                          <span>|</span>
                          <a href="/docs/guides/">Tech Guides</a>
                          <span>|</span>
                          <a href="/docs/system-scripts/">System Scripts</a>
                      </div>
                      <article class="docs-content">{html_content}</article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''
              
              with open('index.html', 'w', encoding='utf-8') as f:
                  f.write(full_html)
          PYTHON_SCRIPT

      - name: Generate docs/system-scripts/index.html
        run: |
          mkdir -p main-repo/docs/system-scripts
          python3 << 'PYTHON_SCRIPT'
          import os
          import re
          import markdown

          readme_path = os.path.join('system-management_scripts', 'README.md')
          with open(readme_path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Fix email markdown link to be a proper mailto
          content = content.replace('](kabwenzenamalomba@gmail.com)', '](mailto:kabwenzenamalomba@gmail.com)')

          # Rewrite repo-relative guide links to the deployed docs HTML pages
          content = re.sub(r'\(guides/([^\)]+?)\.md\)', r'(/docs/guides/\1.html)', content)

          html_content = markdown.markdown(
              content,
              extensions=['fenced_code', 'codehilite', 'tables', 'toc']
          )

          full_html = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>System Scripts - Paul Namalomba</title>
              <link rel="stylesheet" href="/styles.css">
          </head>
          <body class="docs-page">
              <header>
                  <div class="container">
                      <nav>
                          <div class="logo"><a href="/">Paul Namalomba</a></div>
                          <ul class="nav-links">
                              <li><a href="/docs/guides/">Tech Guides</a></li>
                              <li><a href="/docs/system-scripts/">System Scripts</a></li>
                          </ul>
                      </nav>
                  </div>
              </header>

              <main class="container docs-container">
                  <div class="card docs-card">
                      <div class="docs-breadcrumb">
                          <a href="/docs/system-scripts/">System Scripts</a>
                          <span>|</span>
                          <a href="/docs/guides/">Tech Guides</a>
                          <span>|</span>
                          <a href="/">Site Home</a>
                      </div>
                      <article class="docs-content">{html_content}</article>
                  </div>
              </main>

              <footer>
                  <div class="container">
                      <p>&copy; 2025 Paul Namalomba. All rights reserved.</p>
                  </div>
              </footer>
          </body>
          </html>'''

          out_path = os.path.join('main-repo', 'docs', 'system-scripts', 'index.html')
          with open(out_path, 'w', encoding='utf-8') as f:
              f.write(full_html)
          PYTHON_SCRIPT
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: main-repo

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
