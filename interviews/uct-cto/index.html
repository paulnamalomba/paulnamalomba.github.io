<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Access Required</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box fade-in">
      <span class="login-lockicon">🔒</span>
      <h1>Interview Guide</h1>
      <p class="subtitle">Enter access code to continue</p>
      <form id="loginForm" onsubmit="return false;">
        <div class="login-input-group">
          <input type="password" id="passInput" placeholder="Access code" autocomplete="off" autofocus>
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Unlock</button>
        <p class="login-error" id="loginError">Incorrect access code. Try again.</p>
      </form>
    </div>
  </div>
  <script>
    (function(){
      const H='54a15288b39f5bafe59572391e4419c470c1982ee526de37b8b87db4a3811b83';
      if(sessionStorage.getItem('_ig_auth')===H){window.location.replace('hub.html');return;}
      async function sha256(m){const e=new TextEncoder().encode(m);const h=await crypto.subtle.digest('SHA-256',e);return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join('');}
      document.getElementById('loginBtn').addEventListener('click',async function(){
        const p=document.getElementById('passInput').value;
        const h=await sha256(p);
        if(h===H){sessionStorage.setItem('_ig_auth',H);window.location.replace('hub.html');}
        else{const err=document.getElementById('loginError');err.style.display='block';document.getElementById('passInput').value='';document.getElementById('passInput').focus();}
      });
      document.getElementById('passInput').addEventListener('keydown',function(e){if(e.key==='Enter'){document.getElementById('loginBtn').click();}});
    })();
  </script>
</body>
</html>
