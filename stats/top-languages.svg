<svg width="300" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { fill: #58a6ff; font-size: 16px; font-weight: bold; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
      .lang { fill: #c9d1d9; font-size: 13px; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
      .percent { fill: #8b949e; font-size: 12px; font-family: 'Segoe UI', Ubuntu, Sans-Serif; }
    </style>
  </defs>
  
  <rect width="300" height="220" fill="#0d1117" stroke="#30363d" stroke-width="1" rx="4.5"/>
  
  <text x="15" y="30" class="title">💻 Top Languages</text>
  
  <g transform="translate(15, 50)">
    <!-- Python -->
    <circle cx="5" cy="5" r="5" fill="#3572A5"/>
    <text x="20" y="10" class="lang">Python</text>
    <text x="270" y="10" class="percent" text-anchor="end">50.0%</text>
    <!-- HTML -->
    <circle cx="5" cy="35" r="5" fill="#e34c26"/>
    <text x="20" y="40" class="lang">HTML</text>
    <text x="270" y="40" class="percent" text-anchor="end">21.4%</text>
    <!-- TypeScript -->
    <circle cx="5" cy="65" r="5" fill="#2b7489"/>
    <text x="20" y="70" class="lang">TypeScript</text>
    <text x="270" y="70" class="percent" text-anchor="end">14.3%</text>
    <!-- C++ -->
    <circle cx="5" cy="95" r="5" fill="#f34b7d"/>
    <text x="20" y="100" class="lang">C++</text>
    <text x="270" y="100" class="percent" text-anchor="end">7.1%</text>
    <!-- Jupyter Notebook -->
    <circle cx="5" cy="125" r="5" fill="#DA5B0B"/>
    <text x="20" y="130" class="lang">Jupyter Notebook</text>
    <text x="270" y="130" class="percent" text-anchor="end">7.1%</text>
  </g>
</svg>